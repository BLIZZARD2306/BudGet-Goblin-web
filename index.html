<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BudGet – Budget Goblin</title>
  <meta name="description" content="Download the latest BudGet for Android.">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f1ea; --panel: #ffffff; --border: #e8e2dc; --text: #3b3d4a; --muted: #9a958f;
      --mint: #2fc46e; --mint-lip: #1fa75a; --coral: #ff7b4a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #131f24; --panel: #202f36; --border: #37464f; --text: #f1f7fb; --muted: #8ea0a9; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: Nunito, system-ui, sans-serif; font-weight: 600;
      display: flex; align-items: center; justify-content: center; padding: 32px 16px;
    }
    main { width: 100%; max-width: 420px; text-align: center; }
    .goblin { width: 168px; height: 168px; image-rendering: pixelated; }
    h1 { font-weight: 900; font-size: 40px; margin: 8px 0 4px; letter-spacing: -0.5px; }
    .tag { color: var(--muted); margin: 0 0 28px; font-size: 17px; }
    .panel {
      background: var(--panel); border: 2px solid var(--border); border-bottom-width: 5px;
      border-radius: 18px; padding: 22px; text-align: left;
    }
    .version { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .version b { font-weight: 900; font-size: 20px; }
    .version span { color: var(--muted); font-size: 14px; }
    .notes { margin: 10px 0 20px; line-height: 1.5; }
    .notes:empty { display: none; }
    .button {
      display: block; text-align: center; text-decoration: none; color: #fff; background: var(--mint);
      font-weight: 900; font-size: 17px; letter-spacing: 1px; text-transform: uppercase;
      padding: 16px; border-radius: 16px; box-shadow: 0 5px 0 var(--mint-lip);
      transition: transform 80ms, box-shadow 80ms;
    }
    .button:active { transform: translateY(5px); box-shadow: 0 0 0 var(--mint-lip); }
    .button[aria-disabled="true"] { opacity: .5; pointer-events: none; }
    ol { color: var(--muted); font-size: 14px; line-height: 1.6; padding-left: 20px; margin: 20px 0 0; }
    footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <img class="goblin" src="mascot.png" alt="The Budget Goblin celebrating">
    <h1>BudGet</h1>
    <p class="tag">Your Budget Goblin keeps an eye on your money.</p>
    <section class="panel">
      <div class="version"><b id="version">Latest version</b><span id="size"></span></div>
      <p class="notes" id="notes"></p>
      <a class="button" id="download" href="app/budget.apk" download>Download for Android</a>
      <ol>
        <li>Open the downloaded file on your phone.</li>
        <li>If asked, allow your browser to install apps.</li>
        <li>Already have BudGet? It updates itself when you open it.</li>
      </ol>
    </section>
    <footer>Android 7.0 or newer</footer>
  </main>
  <script>
    fetch("app/latest.json", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((v) => {
        document.getElementById("version").textContent = "Version " + v.versionName;
        if (v.apk) document.getElementById("download").href = new URL(v.apk, new URL("app/", location.href)).href;
        document.getElementById("notes").textContent = v.notes || "";
        if (v.sizeMB) document.getElementById("size").textContent = v.sizeMB + " MB";
      })
      .catch(() => {
        document.getElementById("version").textContent = "No release yet";
        document.getElementById("download").setAttribute("aria-disabled", "true");
      });
  </script>
</body>
</html>
